<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media + AI Literacy for Educators — App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Roboto+Slab:wght@500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --sunk:#F1F3EF; --sunk2:#E4E8E2; --line:#CDD2C6;
  --ink:#111111; --muted:#444656;
  --gold:#FFCE3E; --link:#3D5F9E;
  --ok:#55A043; --ok-text:#235213; --warn:#B4501F; --lock:#A5AE9F;
  --display:"Roboto Slab", Rockwell, Georgia, serif;
  --body:"Libre Franklin", "Segoe UI", system-ui, sans-serif;
  --serif:Georgia, "Times New Roman", serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;font-weight:700;text-wrap:balance}
h1{font-size:clamp(2rem,4.4vw,3.1rem)}
h2{font-size:1.4rem}
h3{font-size:1.08rem}
p{margin:0}
a{color:var(--link)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.ruled{padding-bottom:10px;border-bottom:1px solid var(--ink)}
.tag{display:inline-block;width:max-content;background:var(--gold);font-weight:700;font-size:.8rem;padding:3px 9px;line-height:1.35}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}
.note{font-size:.88rem;color:var(--muted);border-left:4px solid var(--gold);padding-left:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:2px solid var(--ink);
  padding:9px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--muted);border-color:var(--muted)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sunk2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#f3bf22;border-color:#f3bf22}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline;font-size:inherit}

/* ---------- shell ---------- */
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
.topbar .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand img{width:150px;display:block}
.brand .series{border-left:1px solid var(--line);padding-left:14px;font-weight:700;font-size:.92rem;line-height:1.25}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 12px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;font-size:.92rem}
.nav button[aria-current=page]{border-bottom-color:var(--gold)}
.nav button:hover{background:var(--sunk)}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.8rem}
@media (max-width:760px){.brand .series{display:none}.nav{order:3;width:100%;margin-left:0}}

.main{max-width:1180px;width:100%;margin:0 auto;padding:28px 20px 48px}
.foot{border-top:1px solid var(--line)}
.foot .in{max-width:1180px;margin:0 auto;padding:18px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.foot img{width:92px;display:block}
.foot .tagline{font-family:var(--serif);font-style:italic;color:var(--ink)}

/* ---------- landing ---------- */
.landing{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:start;padding-top:12px}
@media (max-width:860px){.landing{grid-template-columns:1fr}}
.landing h1{font-size:clamp(2.3rem,5.4vw,3.6rem)}
.lede{font-size:1.12rem;max-width:34em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px}
.facts div{border-top:3px solid var(--ink);padding-top:8px}
.facts b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1}
.facts span{font-size:.85rem;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:16px;background:#fff}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field input{border:1px solid var(--muted);border-radius:var(--r);padding:10px 12px;background:#fff}
.howit{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);margin-top:36px}
.howit div{padding:18px;border-right:1px solid var(--line);display:grid;gap:6px;align-content:start}
.howit div:last-child{border-right:0}
.howit .n{font-family:var(--display);font-size:1.6rem;line-height:1}
@media (max-width:760px){.howit{grid-template-columns:1fr 1fr}.howit div:nth-child(2){border-right:0}.howit div:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* ---------- home ---------- */
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:26px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:960px){.home{grid-template-columns:1fr}}

.path{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:34px}
.step{padding:16px;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line);position:relative;background:#fff}
.step:last-child{border-right:0}
.step.done{background:#EEF6EA}
.step.next{background:#FFF7DA;box-shadow:inset 0 4px 0 var(--gold)}
.step .sn{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.step .st{font-weight:700;line-height:1.25;font-size:.95rem}
.step .ss{font-size:.8rem;color:var(--muted)}
@media (max-width:700px){.path{grid-template-columns:1fr 1fr}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--ink);margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:34px}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;display:grid;grid-template-rows:auto 1fr;overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.card.locked{cursor:not-allowed;opacity:.62}
.card.locked:hover{transform:none;box-shadow:none}
.cover{height:96px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;overflow:hidden}
.cover .code{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;position:relative;z-index:1}
.cover svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.18}
.cover .lockico{position:relative;z-index:1;font-size:.75rem;font-weight:800;background:#fff;color:var(--ink);padding:2px 8px;border-radius:999px}
.card .body{padding:14px;display:grid;gap:8px;align-content:start}
.card .ctitle{font-weight:700;font-size:1.02rem;line-height:1.3;font-family:var(--body)}
.card .cdesc{font-size:.87rem;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:.8rem;color:var(--muted)}
.pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill.done{background:var(--ok);border-color:var(--ok);color:#111}
.pill.prog{border-color:var(--warn);color:var(--warn)}
.pill.req{background:var(--ink);border-color:var(--ink);color:var(--gold)}
.bar{height:6px;background:var(--sunk2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.side{display:grid;gap:18px;position:sticky;top:84px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:var(--r);padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.shelf .slot{display:grid;justify-items:center;gap:2px;text-align:center}
.shelf .slot span{font-size:.6rem;font-weight:700;color:var(--muted);line-height:1.2}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;font-size:.9rem}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.tick.on{background:var(--ok);border-color:var(--ok)}

/* ---------- course player ---------- */
.player{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media (max-width:860px){.player{grid-template-columns:1fr}}
.outline{border-right:1px solid var(--line);background:var(--sunk);padding:22px 18px;display:grid;gap:16px;align-content:start}
@media (max-width:860px){.outline{border-right:0;border-bottom:1px solid var(--line)}}
.outline .back{justify-self:start}
.outline ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:l}
.outline li button{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:var(--r);padding:9px 8px;cursor:pointer;font-size:.9rem;line-height:1.3}
.outline li button:hover:not([disabled]){background:#fff}
.outline li button[aria-current=step]{background:#fff;box-shadow:inset 3px 0 0 var(--gold);font-weight:700}
.outline li button[disabled]{cursor:default;color:var(--muted)}
.outline .ln{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:800;background:#fff}
.outline .ln.on{background:var(--ok);border-color:var(--ok)}
.outline .full{font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stage{display:grid;grid-template-rows:auto 1fr}
.stagebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:3px solid var(--gold);font-size:.85rem}
.scorm{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.scorm i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.lesson{max-width:760px;width:100%;margin:0 auto;padding:36px 24px 60px;display:grid;gap:26px}
.lesson h1{font-size:clamp(1.8rem,3.6vw,2.5rem)}
.lesson .lead{font-size:1.1rem}
.ph{border:2px dashed var(--lock);background:repeating-linear-gradient(45deg,#F4F5F2,#F4F5F2 10px,#ECEEE9 10px,#ECEEE9 20px);border-radius:var(--r);min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.ph b{display:block;letter-spacing:.08em;font-size:.78rem;color:var(--ink)}
.chat{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chat .hd{background:var(--sunk);padding:8px 14px;font-size:.78rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.chat .msg{padding:14px 16px;display:grid;gap:10px}
.bubble{padding:10px 14px;border-radius:12px;max-width:88%;font-size:.95rem}
.bubble.q{background:var(--ink);color:#fff;justify-self:end;border-bottom-right-radius:3px}
.bubble.a{background:var(--sunk);border-bottom-left-radius:3px}
.bubble cite{font-style:normal;font-weight:700}
.choice{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.opt.right{border-color:var(--ok);background:#EEF6EA;box-shadow:inset 4px 0 0 var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--warn);background:#FBEFE8;box-shadow:inset 4px 0 0 var(--warn)}
.opt.wrong .k{border-color:var(--warn);color:var(--warn)}
.opt[disabled]{cursor:default}
.fb{border-radius:var(--r);padding:14px 16px;font-size:.95rem}
.fb.right{background:#EEF6EA;border-left:4px solid var(--ok)}
.fb.wrong{background:#FBEFE8;border-left:4px solid var(--warn)}
.fb b{font-family:var(--display)}
.flip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.flip{grid-template-columns:1fr}}
.flip button{border:1px solid var(--ink);border-radius:var(--r);min-height:130px;padding:14px;background:#fff;cursor:pointer;text-align:left;display:grid;align-content:space-between;gap:8px}
.flip button[aria-pressed=true]{background:var(--ink);color:#fff}
.flip .fk{font-family:var(--display);font-size:1.15rem;font-weight:700}
.flip .fh{font-size:.75rem;color:var(--muted)}
.flip button[aria-pressed=true] .fh{color:var(--gold)}
details.src{border-top:1px solid var(--line);padding-top:12px}
details.src summary{cursor:pointer;font-weight:700}
details.src ul{margin:10px 0 0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.done-card{border:1px solid var(--ink);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:560px){.done-card{grid-template-columns:1fr}}

/* overview */
.ov-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ov-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.ov-list li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
.ov-list li:last-child{border-bottom:0}
.ov-list .i{font-family:var(--display);font-weight:700;color:var(--muted)}

/* tests */
.q fieldset{border:0;padding:0;margin:0 0 6px;min-width:0}
.q legend{font-weight:700;padding:0;margin-bottom:10px}
.qopt{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;margin-bottom:8px}
.qopt:has(input:checked){border-color:var(--ink);box-shadow:inset 4px 0 0 var(--gold)}
.qopt input{margin-top:5px;accent-color:var(--ink)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{display:grid;justify-items:center;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;cursor:pointer;font-weight:700}
.scale label:has(input:checked){border-color:var(--gold);background:var(--gold)}
.scale input{accent-color:var(--ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.narrow{max-width:700px;margin:0 auto;display:grid;gap:22px}

/* certificate */
.cert{background:#fff;border:1px solid var(--line);padding:clamp(24px,5vw,56px);display:grid;gap:22px;position:relative;max-width:900px;margin:0 auto}
.cert::before{content:"";position:absolute;inset:10px;border:2px solid var(--ink);pointer-events:none}
.cert::after{content:"";position:absolute;inset:15px;border:1px solid var(--ink);pointer-events:none}
.cert>*{position:relative;z-index:1}
.cert-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.cert-head img{width:170px}
.cert .name{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;border-bottom:1px solid var(--ink);padding-bottom:10px}
.cert mark{background:var(--gold);padding:0 .2em}
.cert-badges{display:flex;flex-wrap:wrap;gap:14px}
.cert-badges .slot{display:grid;justify-items:center;gap:4px;width:92px;text-align:center;font-size:.72rem}
.cert-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:16px;font-size:.85rem}
.cert-foot b{display:block;font-size:1rem}
.cert-sign{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.cert-sign img{width:110px}

/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.kpi b{font-family:var(--display);font-size:1.9rem;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk)}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.85rem;margin-bottom:6px}
.hbar .t{height:14px;background:var(--sunk2);border-radius:2px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--ink)}

/* real player */
.rplayer{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr;background:#fff}
.ptool{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 18px;border-bottom:3px solid var(--gold);background:#fff}
.ptool .ptitle{font-weight:700;flex:1 1 220px;min-width:0}
.rplayer iframe{width:100%;height:100%;border:0;background:#fff}
/* demo controls + toast + modal */
.demo{position:fixed;left:16px;bottom:16px;z-index:50;display:grid;justify-items:start;gap:8px}
.demo .tray{background:#111;color:#fff;border-radius:8px;padding:14px;display:grid;gap:8px;width:250px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-size:.85rem}
.demo .tray b{color:var(--gold);font-family:var(--display)}
.demo .tray button{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:var(--r);padding:7px 10px;text-align:left;cursor:pointer}
.demo .tray button:hover{background:#3a3a3a}
.demo .fab{background:var(--gold);border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:.8rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:#111;color:#EEF2F3;border-top:4px solid var(--gold);border-radius:var(--r);padding:14px 18px;display:flex;gap:14px;align-items:center;max-width:min(92vw,460px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast b{display:block;font-family:var(--display);color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.toast{animation:rise .35s ease-out}@keyframes rise{from{transform:translate(-50%,16px);opacity:.3}}}
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.55);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:6px;max-width:460px;width:100%;padding:28px;display:grid;gap:16px;justify-items:center;text-align:center;border-top:6px solid var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<div id="demo"></div>
<script src="lib/scorm12.min.js"></script>

<script>
/* =====================================================================
   MOCKUP of the Media + AI Literacy for Educators course app.
   All data is fake and lives in this browser. In production:
   - courses are Rise SCORM 1.2 exports shown in a frame
   - sign-in, progress, tests and badges are stored in Supabase

function badge(c, earned, size=60){

  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${esc(c.title)} badge${earned?"":" (not earned)"}">

    <circle cx="32" cy="32" r="25" fill="${earned?c.color:"transparent"}" stroke="${earned?"none":"#A5AE9F"}" stroke-width="2"/>
    ${earned?`<path d="M25 21.5l4.5 4.5 9-9" fill="none" stroke="${c.ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    <text x="32" y="${earned?42:36.5}" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-weight="800" letter-spacing=".04em" font-size="${fs}" fill="${earned?c.ink:"#A5AE9F"}">${esc(c.code)}</text>

}
function pattern(ink){
  return `<svg class="pat" viewBox="0 0 200 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

}

/* ---------------- course player: real Rise SCORM 1.2 export via scorm-again ---------------- */
const PKG = "courses/sample/scormdriver/indexAPI.html";  // same sample Rise export for every course in this mockup
const PKG_VER = "8bNGzVaW";  // Rise coursePackageVersion of that export. Resume data saved against any other export is dropped, so Rise never tries to reopen a lesson that no longer exists.
let PLAYER = null;
function viewCourse(c){
  if(PLAYER) teardown();
  const saved = S.progress[c.id] || {};
  const prior = (saved.cmi && saved.cmi.pkg === PKG_VER) ? saved.cmi : {};
  const parts = S.user.name.trim().split(/\s+/);
  const lmsName = parts.length>1 ? `${parts.slice(-1)[0]}, ${parts.slice(0,-1).join(" ")}` : S.user.name;
  const api = new window.Scorm12API({ autocommit:true, autocommitSeconds:10, lmsCommitUrl:false, logLevel:5 });
  const resume = !!(prior.suspend_data || prior.lesson_location);
  api.loadFromJSON({
    ...(prior.suspend_data ? { suspend_data:prior.suspend_data } : {}),
    core:{ student_id:S.user.email, student_name:lmsName, lesson_status:prior.lesson_status || "not attempted",
      lesson_location:prior.lesson_location || "", total_time:saved.totalTime || "0000:00:00", entry: resume ? "resume" : "ab-initio" }
  }, "");
  window.API = api;
  if(!S.progress[c.id]){ S.progress[c.id] = { pct:15 }; save(); }
  const persist = () => {
    const r = api.renderCommitCMI(true).cmi || {};
    const status = r.core?.lesson_status || "";
    const rec = S.progress[c.id] || {};
    rec.cmi = { pkg:PKG_VER, suspend_data:r.suspend_data, lesson_location:r.core?.lesson_location, lesson_status:status };
    rec.status = status; rec.totalTime = r.core?.total_time || rec.totalTime;
    rec.pct = Math.max(rec.pct||15, 50);
    S.progress[c.id] = rec;
    if((status==="passed" || status==="completed") && !done(c.id)){
      S.badges[c.id] = new Date().toISOString(); rec.pct = 100; save(); setStatus(status); badgeEarned(c); return;
    }
    save(); setStatus(status);
  };
  const setStatus = st => { const el=$("#pstatus"); if(el) el.textContent = st || "not attempted"; };
  api.on("LMSInitialize", () => { const l=$("#plog"); l && (l.textContent = "Connected · progress saving"); });
  api.on("LMSSetValue.cmi.*", (el, v) => { if(el==="cmi.core.lesson_status") setStatus(v); });
  api.on("LMSCommit", persist);
  api.on("LMSFinish", persist);
  PLAYER = { api, cid:c.id, persist };

  $("#app").innerHTML = `<div class="rplayer">
    <div class="ptool">
      <button class="btn ghost small" data-act="exit">← My courses</button>
      ${badge(c, done(c.id), 36)}
      <span class="ptitle">${esc(c.title)}<span class="tiny muted" style="font-weight:600"> · ${c.type==="core"?"Core course":"Subject course"} · 30 min</span></span>
      <span class="pill">Status: <span id="pstatus">${esc(saved.status || "not attempted")}</span></span>
      <span class="scorm" id="plog"><i></i>Loading Rise course…</span>
      <button class="btn small gold" data-act="simulate" title="Presenter shortcut: reports a pass to the app, as finishing the course would">Demo: mark complete</button>
    </div>
    <iframe id="course" title="${esc(c.title)}" src="${PKG}" allow="fullscreen; autoplay"></iframe>
  </div>`;
  /* Rise's launcher (scormdriver/indexAPI.html) starts the course when the number of frames that have reported "loaded"
     equals the number of frames on its page. Hosts that inject their own frame into every page (Netlify's toolbar,
     some WordPress plugins) throw that count off: the course never starts, or starts twice and shows an
     "Error initializing communications with LMS" pop-up. So: allow only one start, and if the course hasn't
     started shortly after the launcher loads, start it once, from inside the launcher page. */
  const fr = $("#course");
  const guard = () => {  // wrap the launcher's start as soon as its code exists, before any frame reports loaded
    try {
      const R = fr.contentWindow.RiseLMSInterface;
      if(!R || typeof R.start !== "function") return false;
      if(!R.__oneStart){ const riseStart = R.start; R.start = function(){ if(api.isInitialized()) return; return riseStart.apply(this, arguments); }; R.__oneStart = true; }
      return true;
    } catch(e){ return false; }
  };
  const poll = setInterval(() => { if(guard() || !document.body.contains(fr)) clearInterval(poll); }, 10);
  setTimeout(() => clearInterval(poll), 15000);
  fr.addEventListener("load", () => {
    guard();
    setTimeout(() => {
      try {
        if(!PLAYER || PLAYER.api !== api || api.isInitialized()) return;
        const d = fr.contentWindow.document, s = d.createElement("script");
        s.textContent = "RiseLMSInterface.start();";
        d.body.appendChild(s);
      } catch(e){}
    }, 1200);
  }, { once:true });
}
function teardown(){
  const fr = $("#course"); try{ if(fr) fr.src = "about:blank"; }catch(e){}
  try{ PLAYER && PLAYER.persist(); }catch(e){}
  PLAYER = null; window.API = undefined;
}
function exitPlayer(){ teardown(); go("home"); }

function showModal(html){
  const m = document.createElement("div"); m.className="scrim";
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener("click", e => { if(e.target===m || e.target.closest("[data-close]")) m.remove(); });
  document.body.append(m);
  m.querySelector("button")?.focus();
}

/* ---------------- tests ---------------- */
function viewTest(kind){
  const pre = kind==="pre";
  page("home", `<div class="narrow">
    <div class="stack" style="gap:10px"><span class="tag">${pre?"Before you begin":"Last step"}</span>
      <h1 style="font-size:clamp(1.8rem,4vw,2.4rem)">${pre?"Quick pretest":"Posttest"}</h1>
      <p class="muted">${pre?"Four questions, about 3 minutes. This isn't graded. It shows us, and you, what changes by the end of the series.":"The same four questions as the pretest. Your result goes on your certificate next to your pretest score."}</p></div>
    <form id="test" class="stack" style="gap:22px">
      <div class="q"><fieldset><legend>1. ${esc(TEST.confidence)}</legend>
        <div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="conf" value="${n}" ${n===(pre?2:4)?"checked":""}>${n}</label>`).join("")}</div>
        <div class="scale-ends"><span>Not at all confident</span><span>Very confident</span></div></fieldset></div>
      ${TEST.items.map((q,i)=>`<div class="q"><fieldset><legend>${i+2}. ${esc(q.s)}</legend>
        ${q.o.map((o,j)=>`<label class="qopt"><input type="radio" name="q${i}" value="${j}" ${(pre ? (i===1?j===2:j===0) : j===q.a)?"checked":""}><span>${esc(o)}</span></label>`).join("")}
      </fieldset></div>`).join("")}
      <p class="tiny" style="color:var(--warn);font-weight:700">Sample items. Final instrument to come.</p>
      <div class="row"><button class="btn" type="submit">${pre?"Submit and start the course":"Submit and get my certificate"}</button><button type="button" class="btn ghost" data-go="home">Back</button></div>
    </form></div>`);
  $("#test").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const score = TEST.items.reduce((s,q,i)=> s + (Number(fd.get("q"+i))===q.a ? 1 : 0), 0);
    S[kind] = { score, conf:Number(fd.get("conf")||0), at:new Date().toISOString() }; save();
    if(pre){ toast("Pretest saved", `${score} of 3. Let's get started.`); go("course-start"); }
    else { toast("Posttest saved", `${score} of 3. Your certificate is ready.`); go("certificate"); }
  });
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if(g && !g.closest(".modal")) { e.preventDefault(); return go(g.dataset.go); }
  if(g && g.closest(".modal")) { g.closest(".scrim").remove(); return go(g.dataset.go); }
  const a = e.target.closest("[data-act]");
  if(!a) return;
  const act = a.dataset.act;
  if(act==="verify"){ S.user = pending || { email:"jordan.ellis@lincolnusd.org", name:"Jordan Ellis" }; save(); toast("You're signed in", "Next: a quick pretest."); location.hash="pretest"; render(); }
  if(act==="landing") viewLanding();
  if(act==="signout"){ if(PLAYER) teardown(); signOut(); history.replaceState(null,"",location.pathname); viewLanding(); }
  if(act==="exit") exitPlayer();
  if(act==="simulate" && PLAYER){ PLAYER.api.LMSSetValue("cmi.core.lesson_status","passed"); PLAYER.api.LMSSetValue("cmi.core.score.raw","100"); PLAYER.api.LMSCommit(""); }
  if(act==="pdf") toast("PDF download", "In the live app this saves a print-ready PDF.");
  if(act==="copylink") toast("Share link", "In the live app this copies a public verification link.");
  if(act==="csv") toast("CSV export", "In the live app this downloads the full learner table.");
});

  $("#demo").innerHTML = `<div class="demo">
    ${open?`<div class="tray"><b>Presenter controls</b>
      <button data-demo="fresh">Start fresh (clears all demo learners)</button>
      <button data-demo="new">Jordan: pretest done</button>

let demoOpen = false;
document.addEventListener("click", e => {
  const d = e.target.closest("[data-demo]"); if(!d) return;
  const k = d.dataset.demo;
  if(k==="toggle"){ demoOpen=!demoOpen; return demoControls(demoOpen); }
  const user = { email:"jordan.ellis@lincolnusd.org", name:"Jordan Ellis" };
  const stamp = new Date().toISOString();
  const give = ids => Object.fromEntries(ids.map(i=>[i,stamp]));
  const prog = ids => Object.fromEntries(ids.map(i=>[i,{pct:100}]));
  if(k==="fresh"){ signOut(); DB.users = {}; }
  if(k==="new") S = { ...blank(), user, pre:{score:1,conf:2} };
  if(k==="mid") S = { ...blank(), user, pre:{score:1,conf:2}, badges:give(["start","detect","science"]), progress:{...prog(["start","detect","science"]), social:{pct:40}} };
  if(k==="core") S = { ...blank(), user, pre:{score:1,conf:2}, badges:give(["start","detect","science","classroom"]), progress:prog(["start","detect","science","classroom"]) };
  if(k==="all"){ const ids=COURSES.map(c=>c.id); S = { ...blank(), user, pre:{score:1,conf:2}, post:{score:3,conf:4}, badges:give(ids), progress:prog(ids) }; }
  if(k!=="fresh") save(); else { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e){} }
  demoOpen=false; demoControls(false);
  if(k==="fresh"){ history.replaceState(null,"",location.pathname); return viewLanding(); }
  go(k==="all"?"certificate":"home");
});
